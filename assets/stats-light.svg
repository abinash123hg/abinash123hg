<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%"><title>GitHub stats light theme</title><rect width="1000" height="180" rx="20" fill="#f8fafc"/><text x="40" y="60" font-size="28" font-family="Segoe UI,Ubuntu,monospace" fill="#111827">GitHub Activity</text><text x="40" y="110" font-size="21" font-family="Segoe UI,Ubuntu,monospace" fill="#6D28D9">Self-hosted stats refresh through GitHub Actions</text><rect x="40" y="145" width="0" height="4" fill="#6D28D9"><animate attributeName="width" values="0;700;0" dur="5s" repeatCount="indefinite"/></rect></svg>