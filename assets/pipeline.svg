<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="235" viewBox="0 0 1000 235" role="img" aria-labelledby="t"><title id="t">Retrieval-Augmented Generation pipeline</title><rect width="1000" height="235" rx="18" fill="#11172B" stroke="#26304F"/><text x="26" y="36" fill="#F3F5FF" font-family="Arial,sans-serif" font-size="19" font-weight="700">From source data to grounded answers</text><g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="25" y="68" width="155" height="82" rx="12" fill="#211B45" stroke="#7C5CFF"/><text x="102" y="100" fill="#DCD4FF" font-size="15" font-weight="700">1 · Sources</text><text x="102" y="124" fill="#B8AEDF" font-size="12">PDF · Web · Images</text></g><g><rect x="215" y="68" width="155" height="82" rx="12" fill="#102D3C" stroke="#22D3EE"/><text x="292" y="100" fill="#B9F3FF" font-size="15" font-weight="700">2 · Chunk</text><text x="292" y="124" fill="#9CC8D3" font-size="12">Clean + split</text></g><g><rect x="405" y="68" width="155" height="82" rx="12" fill="#123329" stroke="#34D399"/><text x="482" y="100" fill="#B8F7DC" font-size="15" font-weight="700">3 · Embed</text><text x="482" y="124" fill="#9BD3B8" font-size="12">Vectorize text</text></g><g><rect x="595" y="68" width="155" height="82" rx="12" fill="#382A17" stroke="#FBBF24"/><text x="672" y="100" fill="#FFE7AE" font-size="15" font-weight="700">4 · Retrieve</text><text x="672" y="124" fill="#D7BE8C" font-size="12">Relevant context</text></g><g><rect x="785" y="68" width="190" height="82" rx="12" fill="#211B45" stroke="#7C5CFF"/><text x="880" y="100" fill="#DCD4FF" font-size="15" font-weight="700">5 · Generate</text><text x="880" y="124" fill="#B8AEDF" font-size="12">LLM + context</text></g></g><g stroke="#657196" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M182 109h28m-7-7 7 7-7 7M372 109h28m-7-7 7 7-7 7M562 109h28m-7-7 7 7-7 7M752 109h28m-7-7 7 7-7 7"/></g><text x="500" y="193" fill="#A8B3D0" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Retrieve relevant evidence → add context → generate a grounded answer.</text></svg>