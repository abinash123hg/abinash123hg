<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="170" height="170" viewBox="0 0 170 170">
  <defs>
    <clipPath id="c"><circle cx="85" cy="85" r="82"/></clipPath>
  </defs>
  <!-- circular photo -->
  <circle cx="85" cy="85" r="84" fill="#0d1117" stroke="#00d4aa" stroke-width="3"/>
  <g clip-path="url(#c)">
    <image x="0" y="0" width="170" height="170" href="data:image/jpeg;base64," preserveAspectRatio="xMidYMid slice"/>
  </g>
  <!-- Python badge: visible 0.5s–1.0s of 1.5s cycle -->
  <g opacity="0">
    <circle cx="138" cy="138" r="24" fill="#3776AB" stroke="#fff" stroke-width="2"/>
    <text x="138" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">Py</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.34;0.666;0.673;1" dur="1.5s" repeatCount="indefinite"/>
  </g>
  <!-- Java badge: visible 1.0s–1.5s of 1.5s cycle -->
  <g opacity="0">
    <circle cx="138" cy="138" r="24" fill="#ED8B00" stroke="#fff" stroke-width="2"/>
    <text x="138" y="143" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff">Java</text>
    <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.333;0.34;0.666;0.673;1" dur="1.5s" repeatCount="indefinite"/>
  </g>
</svg>