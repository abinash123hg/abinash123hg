<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-labelledby="title desc"><title id="title">AI developer focus</title><desc id="desc">A compact animated focus line highlighting Python, RAG, MCP, and deep learning.</desc><defs><linearGradient id="line"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient><style>@keyframes blink{0%,48%{opacity:1}50%,100%{opacity:0}}@keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}.cursor{animation:blink 1.2s steps(1,end) infinite}.accent{animation:glow 6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.cursor,.accent{animation:none}}</style></defs><rect x="0" y="31" width="900" height="1" fill="#26364D"/><rect x="0" y="30" width="180" height="2" rx="1" fill="url(#line)" class="accent"/><text x="0" y="22" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#CBD5E1">Building with <tspan fill="#38BDF8">Python</tspan><tspan fill="#64748B"> · </tspan><tspan fill="#38BDF8">RAG</tspan><tspan fill="#64748B"> · </tspan><tspan fill="#38BDF8">MCP</tspan><tspan fill="#64748B"> · </tspan><tspan fill="#818CF8">Deep Learning</tspan></text><rect class="cursor" x="522" y="5" width="2" height="20" rx="1" fill="#38BDF8"/><rect x="0" y="0" width="900" height="1.5" fill="url(#line)" opacity=".65"><animate attributeName="y" values="0;64;0" dur="5s" repeatCount="indefinite"/></rect></svg>