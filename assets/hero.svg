<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Abinash Swain — AI & ML Developer">
<title>Abinash Swain — AI & ML Developer</title>
<desc>Animated ninja-style hero: Abinash Swain, AI/ML student building practical RAG, Document AI and MCP agents.</desc>
<defs>
<style>
text{font-family:ui-monospace,Menlo,Consolas,monospace}
.sg{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
.sgm{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}
.jb{font-family:ui-monospace,Menlo,Consolas,monospace}
.jbb{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.fi{animation:fadeIn .7s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
.role{animation:role 14s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes role{0%{opacity:0;transform:translateY(14px)}3.5%{opacity:1;transform:translateY(0)}20%{opacity:1;transform:translateY(0)}23.5%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
.spin2{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite reverse}
.chakra{animation:rise 5s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}18%{opacity:.8}80%{opacity:.5}100%{transform:translateY(-120px);opacity:0}}
.corner{stroke-dasharray:54;animation:draw .7s ease both}
@keyframes draw{from{stroke-dashoffset:54}to{stroke-dashoffset:0}}
.blink{animation:bl 1.1s step-end infinite}
@keyframes bl{0%,50%{opacity:1}50.01%,100%{opacity:0}}
</style>
<linearGradient id="hedge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".55"/><stop offset=".5" stop-color="#272e42"/><stop offset="1" stop-color="#4aa8ff" stop-opacity=".5"/></linearGradient>
<pattern id="hdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".9" fill="#fff" fill-opacity=".05"/></pattern>
<linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#ffb52e"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff5c2b"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-.3 0;.3 0;-.3 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="barG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient>
<radialGradient id="chakraO"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".30"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
<radialGradient id="chakraB"><stop offset="0" stop-color="#4aa8ff" stop-opacity=".24"/><stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur70" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<clipPath id="cardClip"><rect width="1280" height="560" rx="24"/></clipPath>
<clipPath id="hiClip"><rect x="52" y="118" width="300" height="34">
  <animate attributeName="width" values="0;0;300" keyTimes="0;.38;1" dur="1.3s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1"/></rect></clipPath>
<clipPath id="nameClip"><rect x="44" y="150" width="620" height="92">
  <animate attributeName="y" values="242;242;150" keyTimes="0;.52;1" dur="2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1"/></rect></clipPath>
<clipPath id="termClip"><rect x="52" y="52" width="480" height="24">
  <animate attributeName="width" values="0;480" keyTimes="0;1" dur=".9s" begin="0s" fill="freeze"/></rect></clipPath>
<clipPath id="photoClip"><rect x="720" y="70" width="480" height="420" rx="18"/></clipPath>
</defs>

<g clip-path="url(#cardClip)">
  <rect width="1280" height="560" fill="#0b0d13"/>
  <rect width="1280" height="560" fill="url(#hdots)"/>
  <g filter="url(#blur70)">
    <circle cx="200" cy="150" r="190" fill="url(#chakraO)"/>
    <circle cx="980" cy="430" r="230" fill="url(#chakraB)"/>
    <circle cx="640" cy="60" r="150" fill="url(#chakraO)" opacity=".6"/>
  </g>

  <g transform="translate(300,330)" opacity=".04">
    <g transform="scale(14)">
      <path d="M0-11.5c5 0 9.2 3.4 9.2 7.9 0 3.4-2.4 5.9-5.6 5.9-2.4 0-4.2-1.5-4.2-3.6 0-1.7 1.2-2.9 2.8-2.9 1.1 0 2 .7 2 1.8 0 .8-.5 1.4-1.2 1.6" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M-9.2-3.6C-9.2 3.9-4.6 10 1.2 11.5" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M0-11.5c-5.1 0-9.2 3.5-9.2 7.9" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/>
    </g>
  </g>

  <g>
    <path class="corner" d="M742 100V70H772" fill="none" stroke="#ff7a1a" stroke-opacity=".9" stroke-width="2.6" stroke-linecap="round" style="animation-delay:0.35s"/>
    <path class="corner" d="M1178 100V70H1148" fill="none" stroke="#ff7a1a" stroke-opacity=".9" stroke-width="2.6" stroke-linecap="round" style="animation-delay:0.43s"/>
    <path class="corner" d="M742 460V490H772" fill="none" stroke="#ff7a1a" stroke-opacity=".9" stroke-width="2.6" stroke-linecap="round" style="animation-delay:0.51s"/>
    <path class="corner" d="M1178 460V490H1148" fill="none" stroke="#ff7a1a" stroke-opacity=".9" stroke-width="2.6" stroke-linecap="round" style="animation-delay:0.59s"/>

    <rect x="720" y="70" width="480" height="420" rx="18" fill="#12151f" stroke="#272e42" stroke-width="1.5"/>
    <image x="720" y="70" width="480" height="420" href="https://raw.githubusercontent.com/abinash123hg/abinash123hg/main/assets/portrait.gif" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)" opacity="0.95"/>
    
    <g class="fi" style="animation-delay:.7s">
      <g transform="translate(748,472)" class="spin">
        <g transform="scale(0.7)" opacity="0.9">
          <path d="M0-11 3.2-3.2 11 0 3.2 3.2 0 11-3.2 3.2-11 0-3.2-3.2Z" fill="none" stroke="#ff7a1a" stroke-width="1.8" stroke-linejoin="round"/>
          <circle r="2" fill="none" stroke="#ff7a1a" stroke-width="1.5"/>
        </g>
      </g>
      <text class="jbb" x="768" y="477" font-size="12" fill="#eef1f7" letter-spacing="2">SHINOBI.MP4</text>
      <text class="jb" x="1168" y="477" font-size="11" fill="#8b93a7" text-anchor="end" letter-spacing="1.2">KONOHA · LOOP</text>
      <rect x="740" y="492" width="440" height="4" rx="2" fill="#fff" fill-opacity=".1"/>
      <rect x="740" y="492" width="0" height="4" rx="2" fill="url(#barG)">
        <animate attributeName="width" values="0;440" dur="4.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <text clip-path="url(#termClip)" x="52" y="68" font-size="13">
    <tspan class="jbb" fill="#2fd48a">shinobi@konoha</tspan><tspan fill="#8b93a7">:~$ </tspan><tspan fill="#eef1f7">summon </tspan><tspan fill="#ff7a1a">--profile</tspan>
  </text>
  <rect class="blink" x="512" y="56" width="7" height="15" fill="#2fd48a"/>

  <text clip-path="url(#hiClip)" class="sgm" x="52" y="144" font-size="26" fill="#eef1f7">Hi, I'm</text>
  <g clip-path="url(#nameClip)">
    <text class="sg" x="48" y="226" font-size="58" letter-spacing="-1.5" fill="url(#nameG)" filter="url(#glow)">Abinash Swain</text>
  </g>
  <rect x="52" y="246" width="140" height="3.5" rx="1.75" fill="url(#barG)">
    <animate attributeName="width" values="0;0;140" keyTimes="0;.72;1" dur="2.6s" begin="0s" fill="freeze"/>
  </rect>

  <g class="fi" style="animation-delay:1.9s">
    <g transform="translate(60,306)">
      <g transform="scale(0.85)" opacity="1.0">
        <path d="M0-11.5c5 0 9.2 3.4 9.2 7.9 0 3.4-2.4 5.9-5.6 5.9-2.4 0-4.2-1.5-4.2-3.6 0-1.7 1.2-2.9 2.8-2.9 1.1 0 2 .7 2 1.8 0 .8-.5 1.4-1.2 1.6" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/>
        <path d="M-9.2-3.6C-9.2 3.9-4.6 10 1.2 11.5" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/>
        <path d="M0-11.5c-5.1 0-9.2 3.5-9.2 7.9" fill="none" stroke="#ff7a1a" stroke-width="2.1" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <text class="role jb" x="82" y="312" font-size="18" fill="#eef1f7" opacity="1" style="animation-delay:2.0s">AI & ML Developer</text>
  <text class="role jb" x="82" y="312" font-size="18" fill="#eef1f7" opacity="0" style="animation-delay:5.5s">RAG + Document AI Builder</text>
  <text class="role jb" x="82" y="312" font-size="18" fill="#eef1f7" opacity="0" style="animation-delay:9.0s">MCP Agents & Automation</text>
  <text class="role jb" x="82" y="312" font-size="18" fill="#eef1f7" opacity="0" style="animation-delay:12.5s">Practical Systems, Not Just Demos</text>

  <text class="sgm fu" x="52" y="356" font-size="15.5" fill="#8b93a7" style="animation-delay:2.6s">Turning evidence-grounded AI into real tools</text>
  <text class="sgm fu" x="52" y="378" font-size="15.5" fill="#8b93a7" style="animation-delay:2.7s">— one commit at a time.</text>

  <g class="fu" style="animation-delay:3.0s">
    <rect x="52" y="398" width="118" height="54" rx="12" fill="#fff" fill-opacity=".03" stroke="#272e42"/>
    <text class="sg" x="66" y="428" font-size="22" fill="#ff7a1a">45+</text>
    <text class="jb" x="66" y="444" font-size="9" fill="#8b93a7" letter-spacing="1.6">REPOS</text>
  </g>
  <g class="fu" style="animation-delay:3.12s">
    <rect x="184" y="398" width="118" height="54" rx="12" fill="#fff" fill-opacity=".03" stroke="#272e42"/>
    <text class="sg" x="198" y="428" font-size="22" fill="#ff7a1a">AI/ML</text>
    <text class="jb" x="198" y="444" font-size="9" fill="#8b93a7" letter-spacing="1.6">FOCUS</text>
  </g>
  <g class="fu" style="animation-delay:3.24s">
    <rect x="316" y="398" width="118" height="54" rx="12" fill="#fff" fill-opacity=".03" stroke="#272e42"/>
    <text class="sg" x="330" y="428" font-size="20" fill="#ff7a1a">CUTM</text>
    <text class="jb" x="330" y="444" font-size="9" fill="#8b93a7" letter-spacing="1.6">3RD YEAR</text>
  </g>

  <g class="fu" style="animation-delay:3.5s">
    <rect x="450" y="398" width="138" height="54" rx="12" fill="#2fd48a" fill-opacity=".08" stroke="#2fd48a" stroke-opacity=".45"/>
    <circle cx="472" cy="418" r="4.5" fill="#2fd48a">
      <animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text class="jbb" x="484" y="422" font-size="9.5" fill="#2fd48a" letter-spacing="1.3">OPEN TO</text>
    <text class="jbb" x="484" y="440" font-size="9.5" fill="#2fd48a" letter-spacing="1.3">COLLAB</text>
  </g>

  <circle class="chakra" cx="120" cy="470" r="2.2" fill="#ff7a1a" opacity="0" style="animation-delay:0s;animation-duration:5s"/>
  <circle class="chakra" cx="300" cy="500" r="1.6" fill="#ffb52e" opacity="0" style="animation-delay:1.2s;animation-duration:6s"/>
  <circle class="chakra" cx="470" cy="450" r="1.9" fill="#ff7a1a" opacity="0" style="animation-delay:2.4s;animation-duration:5.5s"/>
  <circle class="chakra" cx="210" cy="520" r="1.4" fill="#4aa8ff" opacity="0" style="animation-delay:0.6s;animation-duration:6.5s"/>

  <g transform="translate(1180,96)" opacity=".5">
    <g class="spin2">
      <g transform="scale(1.1)" opacity="0.9">
        <path d="M0-11 3.2-3.2 11 0 3.2 3.2 0 11-3.2 3.2-11 0-3.2-3.2Z" fill="none" stroke="#4aa8ff" stroke-width="1.8" stroke-linejoin="round"/>
        <circle r="2" fill="none" stroke="#4aa8ff" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <g transform="translate(56,520)" class="fi" style="animation-delay:3.8s">
    <text class="jb" x="0" y="0" font-size="11" fill="#8b93a7" letter-spacing="1.2">NINDŌ · </text>
    <text class="jb" x="78" y="0" font-size="11" fill="#ff7a1a" letter-spacing="1.2">I don't just watch anime. I code the jutsu.</text>
  </g>
</g>

<rect x=".75" y=".75" width="1278.5" height="558.5" rx="23.25" fill="none" stroke="url(#hedge)" stroke-width="1.5"/>
</svg>