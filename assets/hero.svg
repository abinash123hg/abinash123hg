<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Abinash Swain — AI and ML Developer</title><desc id="d">Midnight navy banner with subtle neon cyan ambient motion and AI focus.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050B16"/><stop offset="1" stop-color="#101D33"/></linearGradient><linearGradient id="a"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient><pattern id="p" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94A3B8" opacity=".2"/></pattern><style>@keyframes drift{0%,100%{transform:translate(0,0);opacity:.12}50%{transform:translate(-22px,10px);opacity:.2}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes scan{0%{transform:translateX(0);opacity:0}15%{opacity:.55}85%{opacity:.55}100%{transform:translateX(190px);opacity:0}}.glow{animation:drift 16s ease-in-out infinite;transform-origin:center}.dot{animation:pulse 4s ease-in-out infinite}.scan{animation:scan 7s ease-in-out infinite}</style></defs><rect width="1200" height="320" rx="26" fill="url(#bg)"/><rect width="1200" height="320" rx="26" fill="url(#p)"/><g class="glow"><circle cx="1070" cy="55" r="170" fill="#38BDF8" opacity=".13"/></g><g class="glow" style="animation-delay:-8s"><circle cx="1110" cy="310" r="160" fill="#818CF8" opacity=".11"/></g><rect x="48" y="45" width="7" height="226" rx="4" fill="url(#a)"/><text x="82" y="85" fill="#94A3B8" font-family="Arial,sans-serif" font-size="15" letter-spacing="4">HELLO, I'M</text><text x="80" y="145" fill="#F1F5F9" font-family="Arial,sans-serif" font-size="48" font-weight="700">Abinash Swain</text><text x="83" y="185" fill="#38BDF8" font-family="Arial,sans-serif" font-size="22" font-weight="600">AI &amp; ML Developer</text><text x="83" y="220" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="17">RAG · Document AI · OCR · Computer Vision</text>