<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%"><title>Animated footer wave</title><rect width="1000" height="180" rx="18" fill="#0b1020"/><path d="M0 70 Q125 10 250 70 T500 70 T750 70 T1000 70 V180 H0Z" fill="#22D3EE" opacity=".3"><animateTransform attributeName="transform" type="translate" values="0 0;-250 0" dur="8s" repeatCount="indefinite"/></path><path d="M0 100 Q125 40 250 100 T500 100 T750 100 T1000 100 V180 H0Z" fill="#A78BFA" opacity=".3"><animateTransform attributeName="transform" type="translate" values="-250 0;0 0" dur="10s" repeatCount="indefinite"/></path><text x="500" y="155" text-anchor="middle" font-size="17" font-family="Segoe UI,Ubuntu,monospace" fill="#e5f7ff">Built with curiosity · Abinash Swain</text><style>@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></svg>